<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warning Demo</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #222;
        font-family: Arial, sans-serif;
    }

    .box {
        width: 300px;
        padding: 15px;
        background: red;
        border: 3px solid darkred;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 10px black;
    }

    .message {
        color: white;
        font-size: 22px;
        font-weight: bold;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0%, 50% {
            opacity: 1;
        }

        51%, 100% {
            opacity: 0;
        }
    }

    .note {
        color: white;
        margin-top: 10px;
        font-size: 12px;
    }
</style>

</head>

<body>

    <div class="box">
        <div class="message">
            ⚠ YOUR ACCOUNT IS HACKED ⚠
        </div>

        <div class="note">
            This is a demo HTML/CSS animation.
        </div>
    </div>

</body>
</html>
